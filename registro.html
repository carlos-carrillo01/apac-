<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>crear cuenta | apac fresnillo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <div id="app-header"></div>
    <div id="app-flash" class="contenedor"></div>

    <main id="contenido">
        <section class="seccion">
            <div class="contenedor">
                <div class="barra-volver">
                    <a href="index.html" class="boton-volver">← Volver al inicio</a>
                </div>
            </div>
            <div class="contenedor acceso">
                <div class="acceso-info">
                    <span class="sobrelinea">primeros pasos</span>
                    <h1>crear una cuenta</h1>
                    <p>guarda tus sesiones y lleva un registro claro de lo que funciona para tu familia.</p>
                </div>
                <div class="caja">
                    <div id="mensaje-registro"></div>
                    <form id="form-registro" class="formulario">
                        <label for="nombre">tu nombre o el de la persona a cargo</label>
                        <input id="nombre" name="nombre" type="text" autocomplete="name" maxlength="120" required>

                        <label for="correo">correo electronico</label>
                        <input id="correo" name="correo" type="email" autocomplete="email" maxlength="190" required>

                        <label for="clave">clave (minimo 8 caracteres)</label>
                        <input id="clave" name="clave" type="password" autocomplete="new-password" minlength="8" required>

                        <label for="confirmacion">repite la clave</label>
                        <input id="confirmacion" name="confirmacion" type="password" autocomplete="new-password" minlength="8" required>

                        <button class="boton boton-grande" type="submit">crear cuenta</button>
                    </form>
                    <p class="centrado">ya tienes una cuenta? <a id="link-login" href="login.html">inicia sesion</a></p>
                </div>
            </div>
        </section>
    </main>

    <div id="app-footer"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script>
        UI.init('login');
    </script>
</body>
</html>
